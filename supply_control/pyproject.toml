[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hackalem-replenishment"
version = "0.1.0"
description = "Deterministic supplier replenishment calculation core for HackAlem AI"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "openpyxl>=3.1",
]

[tool.setuptools.packages.find]
where = ["src"]

